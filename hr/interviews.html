<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interviews</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="../assets/style.css?v=20261012" rel="stylesheet"><link rel="icon" href="../assets/vijay-logo.png"><style id="rowFit">
@media(max-width:991px){
  .card:has(> #tbl){overflow:hidden}
  #tbl{overflow-x:hidden!important}
  #tbl table{table-layout:fixed;width:100%;font-size:9.5px;line-height:1.25}
  #tbl th,#tbl td{padding:7px 3px;white-space:normal;overflow-wrap:break-word;vertical-align:middle}
  #tbl th{font-size:7px;letter-spacing:0;white-space:normal}
  #tbl th:nth-child(1){width:16%}#tbl th:nth-child(2){width:8%}#tbl th:nth-child(3){width:15%}#tbl th:nth-child(4){width:16%}
  #tbl th:nth-child(5){width:11%}#tbl th:nth-child(6){width:13%}#tbl th:nth-child(7){width:13%}#tbl th:nth-child(8){width:8%}
  #tbl .badge{font-size:7.5px;padding:3px 3px;white-space:normal}
  #tbl .act-btn{width:24px;height:24px;font-size:11px}
  #tbl td:first-child,#tbl th:first-child{padding-left:6px}
}
.act-btn{border:1px solid #cbd5e1;background:transparent;color:#64748b;border-radius:8px;width:34px;height:32px;padding:0;line-height:1}
.act-btn:hover,.act-btn.show{background:#e8f0fe;color:#12315f;border-color:#93b4f5}
.act-dd .dropdown-item{display:flex;align-items:center;width:100%}
body:not(.light) .act-btn{border-color:#223255;color:#8ea0c0}
</style>
</head><body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../assets/config.js"></script><script src="../assets/app.js?v=20261011"></script><script>

layout('interviews'); let page = 1, qs = 'all=1&recent=1';
const tabs = [['Recent','all=1&recent=1'],['Today\'s','when=today'],['Upcoming','when=upcoming'],['Online','type=Online'],['Offline','type=Offline'],['All','all=1']];
$('#content').innerHTML = `<h4>Interviews <small class="text-muted fs-6">Step 2 - interview mudinjathum <b>Finish</b> pannunga</small></h4><ul class="nav nav-pills mb-3">${tabs.map((t,i)=>`<li class="nav-item"><a href="#" class="nav-link ${i==0?'active':''}" onclick="sel(this,'${t[1]}')">${t[0]}</a></li>`).join('')}</ul>
<div class="card"><div class="table-responsive" id="tbl"></div></div><div id="pg"></div>`;
function sel(el, q) { document.querySelectorAll('.nav-link').forEach(a=>a.classList.remove('active')); el.classList.add('active'); qs = q; page = 1; load(); return false; }
async function delIv(id) {
  if (!confirm('Intha interview-ah delete pannalaamaa?\n\nCandidate-oda status update-um, anuppina mail-um serndhu delete aagum. Status \'New\'-ku thirumbidum.')) return;
  try { await api(`/interviews/${id}/`, {method:'DELETE'}); toast('Interview deleted'); load(); } catch(e) { toast(fe(e), 'danger'); }
}
const ivName = {};
async function finishIv(id) {
  const name = ivName[id] || 'this candidate';
  const note = prompt('Mark interview as FINISHED for ' + name + '?\n\nOptional note (interview feedback). OK = Finish, Cancel = stop.', '');
  if (note === null) return;
  try { await api(`/interviews/${id}/finish/`, {method:'POST', body:{description: note.trim()}}); toast('Interview finished. Selected page-ku poren...'); setTimeout(() => location.href = '../hr/resumes.html?status=Selected', 700); } catch(e) { toast(fe(e), 'danger'); }
}
async function sendMail(id) {
  try { const r = await api(`/email-history/${id}/send/`, {method:'POST', body:{}}); toast(r.status=='Sent' ? 'Mail sent to candidate' : 'Mail sending failed', r.status=='Sent' ? 'success' : 'danger'); load(); } catch(e) { toast(fe(e), 'danger'); }
}
async function cancelMail(id) {
  if (!confirm('Intha mail-a cancel pannalaamaa?\n\nCandidate-kku mail anuppave maatom.')) return;
  try { await api(`/email-history/${id}/cancel/`, {method:'POST'}); toast('Mail cancelled. Candidate-kku anuppala.'); load(); } catch(e) { toast(fe(e), 'danger'); load(); }
}
/* Action = one 3-dot menu: Finish (only while the interview is waiting) / View / Delete */
function ivAct(i) {
  const det = `../hr/resume-detail.html?id=${i.resume}`; ivName[i.id] = i.candidate;
  const waiting = i.status == 'Online' || i.status == 'Offline';
  return `<div class="dropdown act-dd"><button type="button" class="btn btn-sm act-btn" data-bs-toggle="dropdown" data-bs-popper-config='{"strategy":"fixed"}' aria-expanded="false" title="Actions"><i class="bi bi-three-dots-vertical"></i></button>
    <ul class="dropdown-menu dropdown-menu-end">
      ${waiting ? `<li><button type="button" class="dropdown-item fw-semibold text-success" onclick="finishIv(${i.id})"><i class="bi bi-check2-circle me-2"></i>Finish</button></li>` : ''}
      <li><a class="dropdown-item" href="${det}"><i class="bi bi-eye me-2"></i>View</a></li>
      <li><button type="button" class="dropdown-item text-danger" onclick="delIv(${i.id})"><i class="bi bi-trash me-2"></i>Delete</button></li>
    </ul></div>`;
}
async function load() {
  const d = await api(`/interviews/?${qs}${qs.includes('all=1') ? '' : '&done=0'}&page=${page}`);   /* Today's / Upcoming / Online / Offline: only interviews waiting for Finish. All: every interview, finished too */
  $('#tbl').innerHTML = table(['Candidate','Job Role','Date','Time','Type','Status','Mail','Action'], d.results.map(i => [esc(i.candidate), esc(i.job_role), fd(i.date), i.time, i.type, badge(i.status), i.pending_email_id ? `<button class="btn btn-sm btn-success me-1" onclick="sendMail(${i.pending_email_id})">Send Mail</button><button class="btn btn-sm btn-outline-danger" onclick="cancelMail(${i.pending_email_id})">Cancel mail</button>` : (i.mail_status ? `<span class="badge bg-${i.mail_status=='Sent'?'success':'danger'}">${i.mail_status=='Sent'?'Mail Sent':i.mail_status}</span>` : '<span class="text-muted">No mail</span>'), ivAct(i)]));
  pager(d, n => { page = n; load(); });
}
load();
</script></body></html>
