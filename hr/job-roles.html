<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Roles</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="../assets/style.css?v=20261012" rel="stylesheet"><link rel="icon" href="../assets/vijay-logo.png"></head><body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../assets/config.js"></script><script src="../assets/app.js?v=20261011"></script><script>
layout('job-roles');
const UN = {Dairy:'Vijay Dairy Milk', Bhavan:'Vijay Bhavan'};
$('#content').innerHTML = `<h3 class="mb-0">Job Roles</h3><p class="text-muted">Roles added here appear in the <b>Job Role</b> dropdown of the resume form, for the selected company only. Delete a role to remove it from the dropdown.</p>
<div class="card mb-3"><div class="card-body"><div id="err"></div><form id="jf" class="row g-2 align-items-end">
<div class="col-md-3"><label class="form-label small">Company *</label><select name="unit" class="form-select"><option value="Dairy">Vijay Dairy Milk</option><option value="Bhavan">Vijay Bhavan</option></select></div>
<div class="col-md-6"><label class="form-label small">Job Role *</label><input name="title" class="form-control" maxlength="120" placeholder="e.g. Sales Executive" required></div>
<div class="col-md-3"><button class="btn btn-primary w-100"><i class="bi bi-plus-lg"></i> Add Job Role</button></div></form></div></div>
<div class="card"><div class="card-body"><div class="d-flex flex-wrap gap-2 mb-3"><select id="fu" class="form-select w-auto"><option value="">All companies</option><option value="Dairy">Vijay Dairy Milk</option><option value="Bhavan">Vijay Bhavan</option></select>
<input id="fq" class="form-control w-auto" placeholder="Search job role..."></div><div class="table-responsive" id="jt"></div></div></div>`;
let all = [];
document.body.insertAdjacentHTML('beforeend', `<div class="modal fade" id="em" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form id="ef" novalidate>
<div class="modal-header"><h5 class="modal-title">Edit Job Role</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
<div class="modal-body"><div id="eerr"></div><input type="hidden" id="eid">
<label class="form-label small">Company *</label><select id="eu" class="form-select mb-3"><option value="Dairy">Vijay Dairy Milk</option><option value="Bhavan">Vijay Bhavan</option></select>
<label class="form-label small">Job Role *</label><input id="et" class="form-control" maxlength="120" required></div>
<div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="esave">Save Changes</button></div></form></div></div></div>`);
const emodal = () => bootstrap.Modal.getOrCreateInstance($('#em'));
function openEdit(id) { const r = all.find(x => x.id == id); if (!r) return;
  $('#eid').value = r.id; $('#eu').value = r.unit; $('#et').value = r.title; $('#eerr').innerHTML = ''; emodal().show();
  setTimeout(() => $('#et').focus(), 300); }
$('#ef').onsubmit = async e => { e.preventDefault(); const b = $('#esave'); b.disabled = true;
  try { await api('/job-roles/' + $('#eid').value + '/', {method:'PATCH', body:{unit:$('#eu').value, title:$('#et').value}});
    emodal().hide(); toast('Job role updated'); load(); }
  catch(x) { $('#eerr').innerHTML = `<div class="alert alert-danger py-2">${fe(x)}</div>`; }
  b.disabled = false; };
function draw() {
  const u = $('#fu').value, q = $('#fq').value.trim().toLowerCase();
  const l = all.filter(r => (!u || r.unit == u) && (!q || r.title.toLowerCase().includes(q)));
  $('#jt').innerHTML = l.length ? table(['Company','Job Role',''], l.map(r => [UN[r.unit], `<b>${esc(r.title)}</b>`,
    `<div class="d-flex gap-1 justify-content-end"><button class="btn btn-sm btn-outline-primary" onclick="openEdit(${r.id})" title="Edit"><i class="bi bi-pencil-square"></i></button><button class="btn btn-sm btn-outline-danger" onclick="del(${r.id})" title="Delete"><i class="bi bi-trash"></i></button></div>`])) : '<div class="text-muted p-2">No job roles found.</div>';
}
async function load() { try { all = await api('/job-roles/'); } catch(e) { all = []; } draw(); }
async function del(id) { if (!confirm('Delete this job role? It will be removed from the resume form dropdown.')) return;
  try { await api('/job-roles/' + id + '/', {method:'DELETE'}); toast('Job role deleted'); load(); } catch(e) { toast(fe(e), 'danger'); } }
$('#jf').onsubmit = async e => { e.preventDefault();
  try { await api('/job-roles/', {method:'POST', body:Object.fromEntries(new FormData(e.target))}); $('#err').innerHTML = ''; e.target.elements.title.value = ''; toast('Job role added'); load(); }
  catch(x) { $('#err').innerHTML = `<div class="alert alert-danger">${fe(x)}</div>`; } };
$('#fu').onchange = draw; $('#fq').oninput = draw;
load();
</script></body></html>
