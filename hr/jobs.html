<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Openings</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="../assets/style.css?v=20261012" rel="stylesheet"><link rel="icon" href="../assets/vijay-logo.png"><style>
.act-btn{border:1px solid #cbd5e1;background:transparent;color:#64748b;border-radius:8px;width:34px;height:32px;padding:0;line-height:1}
.act-btn:hover,.act-btn.show{background:#e8f0fe;color:#12315f;border-color:#93b4f5}
.act-dd .dropdown-menu{min-width:150px;font-size:.9rem}
.act-dd .dropdown-item{display:flex;align-items:center;width:100%}
body:not(.light) .act-btn{border-color:#223255;color:#8ea0c0}
body:not(.light) .act-btn:hover,body:not(.light) .act-btn.show{background:#16213b;color:#fff}
</style></head><body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../assets/config.js"></script><script src="../assets/app.js?v=20261011"></script><script>
layout('jobs');
const UN = {Dairy:'Vijay Dairy Milk', Bhavan:'Vijay Bhavan'}, today = new Date().toLocaleDateString('en-CA');
const state = j => j.end_date < today ? '<span class="badge bg-secondary">Expired</span>' : j.start_date > today ? '<span class="badge bg-warning text-dark">Scheduled</span>' : '<span class="badge bg-success">Live</span>';
$('#content').innerHTML = `<h3 class="mb-0">Job Openings</h3><p class="text-muted">Create openings for a date range. They show on the public careers page only between the From and To dates.</p>
<div class="card mb-3"><div class="card-body"><div id="err"></div><form id="jf" class="row g-2 align-items-end">
<div class="col-md-2"><label class="form-label small">Company *</label><select name="unit" class="form-select"><option value="Dairy">Vijay Dairy Milk</option><option value="Bhavan">Vijay Bhavan</option></select></div>
<div class="col-md-3"><label class="form-label small">Job Title *</label><input name="title" class="form-control" required></div>
<div class="col-md-2"><label class="form-label small">Location *</label><input name="location" class="form-control" required></div>
<div class="col-md-2"><label class="form-label small">Type</label><select name="job_type" class="form-select"><option>Full Time</option><option>Part Time</option><option>Contract</option><option>Internship</option></select></div>
<div class="col-md-1"><label class="form-label small">From *</label><input type="date" name="start_date" class="form-control px-1" value="${today}" required></div>
<div class="col-md-1"><label class="form-label small">To *</label><input type="date" name="end_date" class="form-control px-1" required></div>
<div class="col-md-1"><button class="btn btn-primary w-100">Add</button></div></form></div></div>
<div class="card"><div class="card-body"><div class="table-responsive" id="jt"></div></div></div>`;
let jobs = [];
document.body.insertAdjacentHTML('beforeend', `<div class="modal fade" id="em" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form id="ef">
<div class="modal-header"><h5 class="modal-title">Edit Job Opening</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
<div class="modal-body"><div id="eerr"></div><input type="hidden" name="id">
<div class="row g-2"><div class="col-md-6"><label class="form-label small">Company *</label><select name="unit" class="form-select"><option value="Dairy">Vijay Dairy Milk</option><option value="Bhavan">Vijay Bhavan</option></select></div>
<div class="col-md-6"><label class="form-label small">Type</label><select name="job_type" class="form-select"><option>Full Time</option><option>Part Time</option><option>Contract</option><option>Internship</option></select></div>
<div class="col-md-6"><label class="form-label small">Job Title *</label><input name="title" class="form-control" maxlength="120" required></div>
<div class="col-md-6"><label class="form-label small">Location *</label><input name="location" class="form-control" maxlength="120" required></div>
<div class="col-md-6"><label class="form-label small">From *</label><input type="date" name="start_date" class="form-control" required></div>
<div class="col-md-6"><label class="form-label small">To *</label><input type="date" name="end_date" class="form-control" required></div></div></div>
<div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="esave">Save Changes</button></div></form></div></div></div>`);
const emodal = () => bootstrap.Modal.getOrCreateInstance($('#em'));
function openEdit(id) { const j = jobs.find(x => x.id == id); if (!j) return; const f = $('#ef').elements;
  ['id','unit','title','location','job_type','start_date','end_date'].forEach(k => f[k].value = j[k]); $('#eerr').innerHTML = ''; emodal().show(); }
$('#ef').onsubmit = async e => { e.preventDefault(); const b = $('#esave'); b.disabled = true; const d = Object.fromEntries(new FormData(e.target)), id = d.id; delete d.id;
  try { await api('/jobs/' + id + '/', {method:'PATCH', body:d}); emodal().hide(); toast('Opening updated'); load(); }
  catch(x) { $('#eerr').innerHTML = `<div class="alert alert-danger py-2">${fe(x)}</div>`; }
  b.disabled = false; };
async function load() {
  const u = hrUnit(); const l = jobs = await api('/jobs/?all=1' + (u ? '&unit=' + u : ''));
  $('#jt').innerHTML = table(['Company','Job Title','Location','Type','From','To','Status',''], l.map(j=>[UN[j.unit], `<b>${esc(j.title)}</b>`, esc(j.location), esc(j.job_type), fd(j.start_date), fd(j.end_date), state(j), `<div class="dropdown act-dd"><button type="button" class="btn btn-sm act-btn" data-bs-toggle="dropdown" data-bs-popper-config='{"strategy":"fixed"}' aria-expanded="false" title="Actions"><i class="bi bi-three-dots-vertical"></i></button><ul class="dropdown-menu dropdown-menu-end"><li><button type="button" class="dropdown-item" onclick="openEdit(${j.id})"><i class="bi bi-pencil-square me-2"></i>Edit</button></li><li><button type="button" class="dropdown-item text-danger" onclick="del(${j.id})"><i class="bi bi-trash me-2"></i>Delete</button></li></ul></div>`]));
}
async function del(id) { if (!confirm('Delete this opening?')) return; try { await api('/jobs/' + id + '/', {method:'DELETE'}); load(); } catch(e) { toast(fe(e), 'danger'); } }
$('#jf').onsubmit = async e => { e.preventDefault();
  try { await api('/jobs/', {method:'POST', body:Object.fromEntries(new FormData(e.target))}); $('#err').innerHTML = ''; e.target.elements.title.value = ''; e.target.elements.location.value = ''; toast('Opening added'); load(); }
  catch(x) { $('#err').innerHTML = `<div class="alert alert-danger">${fe(x)}</div>`; } };
load();
</script></body></html>
