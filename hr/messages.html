<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="../assets/style.css?v=20261012" rel="stylesheet"><link rel="icon" href="../assets/vijay-logo.png"></head><body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../assets/config.js"></script><script src="../assets/app.js?v=20261011"></script><script>

layout('messages'); let page = 1;
$('#content').innerHTML = `<h4>Contact Messages</h4><p class="text-muted small">Messages sent from the Contact &amp; Location form on the home page.</p>
<div class="row g-2 mb-3"><div class="col-md-4"><input id="f_q" class="form-control" placeholder="Name / email / message"></div>
<div class="col-md-2"><select id="f_un" class="form-select"><option value="">All</option><option value="1">Unread only</option></select></div>
<div class="col-md-2"><input type="date" id="f_start" class="form-control"></div><div class="col-md-2"><input type="date" id="f_end" class="form-control"></div><div class="col-md-2"><button class="btn btn-primary w-100" onclick="page=1;load()">Filter</button></div></div>
<div class="card"><div class="table-responsive" id="tbl"></div></div><div id="pg"></div>`;
async function load() {
  const p = new URLSearchParams({page}); [['q','f_q'],['unread','f_un'],['start','f_start'],['end','f_end']].forEach(([k,i]) => { const v = $('#'+i).value; if (v) p.set(k, v); });
  const d = await api('/contact/?' + p);
  $('#tbl').innerHTML = table(['From','Email','Message','Received','Status','Actions'], d.results.map(m => [
    `<span class="${m.is_read?'':'fw-bold'}">${esc(m.name)}</span>`,
    `<a href="mailto:${esc(m.email)}?subject=${encodeURIComponent('Re: Your message to Vijay Group')}">${esc(m.email)}</a>`,
    `<div style="max-width:380px;white-space:pre-wrap">${esc(m.message)}</div>`, fd(m.created_at),
    `<span class="badge bg-${m.is_read?'secondary':'success'}">${m.is_read?'Read':'New'}</span>`,
    `<div class="d-flex gap-1">${m.is_read?'':`<button class="btn btn-sm btn-outline-success" onclick="mark(${m.id})">Mark read</button>`}<button class="btn btn-sm btn-outline-danger" onclick="del(${m.id})">Delete</button></div>`]));
  pager(d, n => { page = n; load(); });
}
async function mark(id) { try { await api(`/contact/${id}/`, {method:'PATCH', body:{is_read:true}}); load(); } catch(e) { toast(fe(e),'danger'); } }
async function del(id) { if (!confirm('Delete this message?')) return; try { await api(`/contact/${id}/`, {method:'DELETE'}); toast('Deleted'); load(); } catch(e) { toast(fe(e),'danger'); } }
load();
</script></body></html>
