<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="../assets/style.css?v=20261012" rel="stylesheet"><link rel="icon" href="../assets/vijay-logo.png"></head><body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../assets/config.js"></script><script src="../assets/app.js?v=20261011"></script><script>

layout('notifications');
let ALL = [], ROWS = [], FLT = '', cur = null, ci = 0;
const C = {'New Resume':'info','Upcoming Interview':'warning text-dark','Status Update':'primary','Email Failure':'danger'};
async function load() {
  ALL = (await api('/notifications/')).results;
  const g = {};   // one row per candidate (their last update); older updates stay inside View
  ALL.forEach(n => { const k = n.resume ? 'r' + n.resume : 'n' + n.id; (g[k] = g[k] || []).push(n); });
  ROWS = Object.values(g).map(a => { a.sort((x, y) => new Date(y.created_at) - new Date(x.created_at)); return a; }).sort((x, y) => new Date(y[0].created_at) - new Date(x[0].created_at));
  draw();
}
function draw() {
  const unread = ROWS.filter(a => a.some(n => !n.is_read)).length;
  const list = ROWS.map((a, i) => [a, i]).filter(([a]) => !FLT || (FLT == 'Unread' ? a.some(n => !n.is_read) : a[0].kind == FLT));
  $('#content').innerHTML = `<div class="d-flex justify-content-between align-items-center mb-3"><div><h4 class="mb-0">Notifications</h4><small class="text-muted">${unread ? unread + ' unread' : 'All caught up'}</small></div>
    <button class="btn btn-outline-secondary btn-sm" onclick="markRead()" ${unread ? '' : 'disabled'}>Mark all read</button></div>
  <div class="row g-2 mb-3"><div class="col-md-3"><select class="form-select" onchange="FLT=this.value;draw()"><option value="">All</option><option ${FLT=='Unread'?'selected':''}>Unread</option>${Object.keys(C).map(k => `<option ${FLT==k?'selected':''}>${k}</option>`).join('')}</select></div></div>
  <div class="card"><div class="table-responsive">${table(['Email','Message','Date','Type','Action'], list.map(([a, i]) => { const n = a[0], un = a.some(x => !x.is_read); return [
    `<b>${esc(n.candidate || '-')}</b><br><small class="text-muted">${esc(n.email || '')}</small>`, `<span class="${un ? 'fw-semibold' : ''}">${esc(n.message)}</span>${a.length > 1 ? ` <span class="badge bg-light text-secondary border">${a.length} updates</span>` : ''}`, fd(n.created_at),
    `<span class="badge bg-${C[n.kind]||'secondary'}">${n.kind}</span>`,
    `<div class="dropdown"><button class="btn btn-sm btn-light border" data-bs-toggle="dropdown" data-bs-popper-config='{"strategy":"fixed"}' title="Actions"><i class="bi bi-three-dots-vertical"></i></button><ul class="dropdown-menu dropdown-menu-end">
      <li><a class="dropdown-item" href="#" onclick="viewN(${i});return false"><i class="bi bi-eye me-2"></i>View</a></li>
      ${n.resume ? `<li><a class="dropdown-item text-danger" href="#" onclick="delRow(${i});return false"><i class="bi bi-trash me-2"></i>Delete</a></li>` : (n.id ? `<li><a class="dropdown-item text-danger" href="#" onclick="delOne(${n.id});return false"><i class="bi bi-trash me-2"></i>Delete</a></li>` : '')}</ul></div>`]; }))}</div></div>`;
}
/* ---- View: all messages of the candidate on one page (newest first, with time), 20 per page ---- */
const PS = 20; let np = 1;
async function viewN(i) {
  cur = ROWS[i]; np = 1; showN(); bootstrap.Modal.getOrCreateInstance('#nModal').show();
  const r = cur[0].resume; if (r && cur.some(n => !n.is_read)) { try { await api('/notifications/', {method:'POST', body:{resume:r}}); cur.forEach(n => n.is_read = true); draw(); } catch (e) {} }
}
function showN() {
  const f = cur[0], tot = cur.length, pages = Math.ceil(tot / PS), items = cur.slice((np - 1) * PS, np * PS);
  $('#nTitle').textContent = f.candidate || 'Notification'; $('#nSub').textContent = f.email || '';
  $('#nList').innerHTML = items.map(n => `<div class="d-flex align-items-start gap-2 py-2 border-bottom"><span class="badge bg-${C[n.kind]||'secondary'} mt-1" style="min-width:110px">${n.kind}</span>
    <div class="flex-grow-1" style="min-width:0;word-break:break-word">${esc(n.message)}<div class="small text-muted">${fd(n.created_at)}</div></div>
    ${n.id ? `<button class="btn btn-sm btn-outline-danger border-0" title="Delete" onclick="delCur(${n.id})"><i class="bi bi-trash"></i></button>` : ''}</div>`).join('');
  $('#nPos').textContent = tot + ' message' + (tot > 1 ? 's' : '') + (pages > 1 ? ' · Page ' + np + ' of ' + pages : '');
  $('#nPrev').disabled = np <= 1; $('#nNext').disabled = np >= pages; $('#nPager').classList.toggle('d-none', pages <= 1);
}
function nNav(d) { np += d; showN(); $('#nList').scrollTop = 0; }
async function delCur(id) {
  if (!confirm('Indha message-a delete pannattuma?')) return;
  await api('/notifications/' + id + '/', {method:'DELETE'}); toast('Message deleted');
  const k = cur[0].resume; await load();
  const i = ROWS.findIndex(a => a[0].resume == k && k); if (i < 0) { bootstrap.Modal.getOrCreateInstance('#nModal').hide(); return; }
  cur = ROWS[i]; np = Math.min(np, Math.ceil(cur.length / PS)); showN();
}
async function delRow(i) { const r = ROWS[i][0].resume; if (!confirm('Indha candidate-oda ella notification-um delete pannattuma?')) return; await api('/notifications/?resume=' + r, {method:'DELETE'}); toast('Deleted'); load(); }
async function delOne(id) { if (!confirm('Indha notification-a delete pannattuma?')) return; await api('/notifications/' + id + '/', {method:'DELETE'}); toast('Deleted'); load(); }
async function markRead() { await api('/notifications/', {method:'POST', body:{}}); load(); }
load();
</script>
<div class="modal fade" id="nModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content">
  <div class="modal-header" style="background:#1e3a6e;color:#fff"><div><div class="fw-semibold" id="nTitle"></div><small class="opacity-75" id="nSub"></small></div><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
  <div class="modal-body py-2" id="nList" style="max-height:60vh;overflow-y:auto"></div>
  <div class="modal-footer justify-content-between"><small class="text-muted" id="nPos"></small>
    <div id="nPager"><button class="btn btn-sm btn-outline-secondary" id="nPrev" onclick="nNav(-1)">Prev</button> <button class="btn btn-sm btn-outline-secondary" id="nNext" onclick="nNav(1)">Next</button></div></div></div></div></div>
<script></script></body></html>
