<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="../assets/style.css?v=20261012" rel="stylesheet"><link rel="icon" href="../assets/vijay-logo.png"></head><body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../assets/config.js"></script><script src="../assets/app.js?v=20261011"></script><script>

layout('reports');
$('#content').innerHTML = `<h4>Reports</h4><div class="row g-2 mb-3"><div class="col-md-3"><input type="date" id="f_start" class="form-control"></div><div class="col-md-3"><input type="date" id="f_end" class="form-control"></div><div class="col-md-2"><button class="btn btn-primary w-100" onclick="load()">Apply</button></div></div><div id="rep"></div>`;
const sec = (t, cols, rows) => `<div class="col-lg-6"><div class="card h-100"><div class="card-header fw-semibold">${t}</div><div class="table-responsive">${table(cols, rows)}</div></div></div>`;
async function load() {
  const p = new URLSearchParams(); ['start','end'].forEach(k => { const v = $('#f_'+k).value; if (v) p.set(k, v); });
  const d = await api('/reports/?' + p), g = (a,k) => a.map(x => [esc(x[k]), x.count]);
  $('#rep').innerHTML = `<div class="alert alert-primary">Total resumes: <b>${d.total}</b></div><div class="row g-3">
  ${sec('Status-wise',['Status','Count'],g(d.by_status,'status'))}${sec('Fresher vs Experienced',['Type','Count'],g(d.by_type,'exp_type'))}
  ${sec('Job-role-wise',['Role','Count'],g(d.by_role,'job_role'))}${sec('Location-wise',['Location','Count'],g(d.by_location,'location'))}
  ${sec(`Interview report (Online ${d.interviews.online} / Offline ${d.interviews.offline})`,['Candidate','Date','Type'],d.interviews.list.map(i=>[esc(i.candidate),fd(i.date),i.type]))}
  ${sec('Selected / Rejected',['Resume ID','Name','Role','Status'],d.selected_rejected.map(r=>[r.resume_id,esc(r.name),esc(r.job_role),badge(r.status)]))}</div>`;
}
load();
</script></body></html>
