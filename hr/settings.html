<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="../assets/style.css?v=20261012" rel="stylesheet"><link rel="icon" href="../assets/vijay-logo.png"></head><body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../assets/config.js"></script><script src="../assets/app.js?v=20261011"></script><script>

layout('settings');
$('#content').innerHTML = `<h4 class="mb-3">Profile</h4><div class="row g-3" style="max-width:1000px">
<div class="col-lg-6"><div class="card h-100"><div class="card-body"><div class="sect"><i class="bi bi-person-circle"></i>Profile</div>
  <div class="d-flex align-items-center gap-3 mb-3"><span class="avatar" id="pav" style="width:56px;height:56px;font-size:1.4rem">H</span><div><div class="fw-bold" id="pname">-</div><small class="text-muted" id="pmail">-</small></div></div>
  <div id="perr"></div>
  <form id="pform"><label class="form-label">Name</label><input id="p_name" class="form-control mb-3" placeholder="Your full name" maxlength="150" required>
  <label class="form-label">Email</label><input id="p_email" type="email" class="form-control mb-3" placeholder="Your email address" required>
  <label class="form-label">Username <small class="text-muted">(cannot be changed)</small></label><input id="p_user" class="form-control mb-3" disabled>
  <button class="btn btn-primary" id="psave">Save Profile</button></form></div></div></div>
<div class="col-lg-6"><div class="card h-100"><div class="card-body"><div class="sect"><i class="bi bi-shield-lock"></i>Change Password</div><div id="werr"></div>
  <form id="wform"><label class="form-label">Current Password</label><input id="w_cur" type="password" class="form-control mb-3" autocomplete="current-password" required>
  <label class="form-label">New Password</label><input id="w_new" type="password" class="form-control mb-3" autocomplete="new-password" minlength="8" required>
  <label class="form-label">Confirm New Password</label><input id="w_con" type="password" class="form-control mb-3" autocomplete="new-password" minlength="8" required>
  <button class="btn btn-primary" id="wsave">Change Password</button></form></div></div></div></div>`;

function show(u) { const n = u.name || (u.username||'HR').split('@')[0];
  $('#pname').textContent = n; $('#pmail').textContent = u.email || '-'; $('#pav').textContent = n[0].toUpperCase();
  $('#p_name').value = u.name || ''; $('#p_email').value = u.email || ''; $('#p_user').value = u.username;
  $('#un').textContent = n; $('#av').textContent = n[0].toUpperCase(); }
api('/auth/me/').then(show).catch(e => toast(fe(e), 'danger'));

$('#pform').onsubmit = async e => { e.preventDefault(); $('#perr').innerHTML = ''; const b = $('#psave'); b.disabled = true;
  try { show(await api('/auth/me/', {method:'PATCH', body:{name:$('#p_name').value, email:$('#p_email').value}})); toast('Profile updated'); }
  catch(x) { $('#perr').innerHTML = `<div class="alert alert-danger py-2 small">${fe(x)}</div>`; }
  b.disabled = false; };
$('#wform').onsubmit = async e => { e.preventDefault(); $('#werr').innerHTML = '';
  if ($('#w_new').value !== $('#w_con').value) { $('#werr').innerHTML = '<div class="alert alert-danger py-2 small">New password and confirm password do not match.</div>'; return; }
  const b = $('#wsave'); b.disabled = true;
  try { await api('/auth/change-password/', {method:'POST', body:{current_password:$('#w_cur').value, new_password:$('#w_new').value}}); e.target.reset(); toast('Password changed. Logging out, please login with your new password...'); setTimeout(logout, 1500); return; }
  catch(x) { $('#werr').innerHTML = `<div class="alert alert-danger py-2 small">${fe(x)}</div>`; }
  b.disabled = false; };
</script></body></html>
